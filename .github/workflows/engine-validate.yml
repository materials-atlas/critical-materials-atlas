name: engine-validate
# The trade engine (reconcile/) — share-faithful Comtrade->BACI reconciliation + nowcast — was consolidated
# into this repo from the former standalone Varcolacus/comtrade-reconcile. This re-proves it reproduces end
# to end and catches dependency drift. The raw-Comtrade leg (raw -> reconciliation -> validated vs BACI)
# is not run here: raw UN Comtrade declarations are not redistributed, so that leg runs on the
# maintainer's machine before every release (reconcile/validate_fixtures.py).
on:
  push:
    paths: ['reconcile/**', '.github/workflows/engine-validate.yml']
  workflow_dispatch:
  schedule:
    - cron: '0 6 1 * *'   # monthly keepalive
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reconcile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Out-of-sample backtest + the origin-gap finding (no API key)
        run: |
          python backtest.py
          python findings.py
          test -f results/backtest.json && test -f results/findings.json
          echo "backtest + findings reproduced."
