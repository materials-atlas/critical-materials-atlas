name: baci-release-watch
# The 2025 nowcast (reconcile/PREREGISTRATION.md) is scored the moment CEPII publishes a BACI release
# carrying trade-year 2025. Nothing signals that; check_baci_release.py HEADs the versioned zip. This
# runs it monthly and opens an issue when the answer changes, so the bet is not resolved by someone
# remembering to look. It only makes HEAD requests and needs no key.
on:
  schedule:
    - cron: '0 7 5 * *'   # the 5th of each month, 07:00 UTC
  workflow_dispatch:
permissions:
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - id: probe
        name: Has CEPII published a release newer than V202601?
        run: |
          set +e
          python check_baci_release.py > probe.txt 2>&1
          code=$?
          cat probe.txt
          echo "code=$code" >> "$GITHUB_OUTPUT"
        # exit 0 = a newer release exists, 1 = not yet, 2 = cannot tell (URL scheme changed, or CEPII down)
      - name: Open an issue when a newer release exists, or when the check itself breaks
        if: steps.probe.outputs.code != '1'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const out = fs.readFileSync('probe.txt', 'utf8');
            const ready = '${{ steps.probe.outputs.code }}' === '0';
            const title = ready
              ? 'BACI 2025 is out - score the pre-registered 2025 nowcast'
              : 'baci-release-watch could not tell (check the CEPII URL scheme)';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'baci-watch',
            });
            if (existing.data.some(i => i.title === title)) return;
            const body = ready
              ? ['CEPII has published a BACI release newer than V202601.', '', '```', out, '```', '',
                 'Procedure (check_baci_release.py header, reconcile/PREREGISTRATION.md):',
                 '1. Download into `raw/baci/`.',
                 '2. `python reconcile/validate.py 2025` against the frozen `out/flows_2025.json`.',
                 '3. Commit the output to `reconcile/results/` - pass or fail; the filing commits to publishing a miss.',
                 '4. Only then, the short note owed to Morgan Bazilian (Payne Institute).'].join('\n')
              : ['The monthly check could not answer. It verifies its URL pattern against the known-good',
                 'V202601 on every run and fails loudly rather than reporting "not yet", so this usually',
                 'means CEPII changed the URL scheme or was unreachable.', '', '```', out, '```'].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['baci-watch'],
            });
